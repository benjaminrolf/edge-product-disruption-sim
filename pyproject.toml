[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsim"
version = "1.0.0"
description = "Agent-based disruption simulation on a product-annotated supply network (MarkLines)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Rolf" }]
requires-python = ">=3.12"
# Pinned to the versions that produced the results of the paper
dependencies = [
    "networkx==3.6.1",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "polars==1.40.1",
    "pandas==3.0.2",
    "pyarrow==24.0.0",
    "ordered-set==4.1.0",
    "xlsxwriter==3.2.9",
]

[project.optional-dependencies]
analysis = [
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "scikit-learn==1.8.0",
    "geopandas==1.1.3",
    "shapely==2.1.2",
    "python-igraph==1.0.0",
    "powerlaw==2.0.0",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
